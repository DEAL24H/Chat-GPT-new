name: Six Category Catalog Guard

on:
  workflow_dispatch:

# The 534-brand catalog is locked. This legacy migration workflow is now
# manual-only and read-only so it can never rewrite or replace the catalog.
concurrency:
  group: deal24h-main-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate locked 6 x 89 catalog
        run: python scripts/validate_catalog_999.py
      - name: Validate site against catalog-owned destinations
        run: python bot/validate_site_fast.py
