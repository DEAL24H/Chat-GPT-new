name: Deal Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'
      - 'data/deal_state.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'fashion/**'
      - 'beauty/**'
      - 'gaming/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal-bot-main
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Collect public coupon deals
        run: python bot/news_bot.py
      - name: Generate international SEO pages
        run: python bot/seo_generator.py
      - name: Commit deal data and SEO pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/deal_state.json sitemap.xml robots.txt fashion beauty gaming
          git diff --cached --quiet || git commit -m 'chore: update coupon data and SEO pages'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
