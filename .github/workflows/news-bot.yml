name: Deal Bot
on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Optional category group: 0 = Fashion/Beauty/Consumer, 1 = Home & Living/Food & Grocery/Travel & Hotels; blank = full cycle'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-bot.yml'
  schedule:
    - cron: '0 22 * * *' # 05:00 Vietnam time
    - cron: '0 6 * * *'  # 13:00 Vietnam time
    - cron: '0 14 * * *' # 21:00 Vietnam time
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal24h-main-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Validate code syntax
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-fix.js
          node --check assets/app-999.js
          node --check assets/app-home.js
      - name: Validate locked 6-category catalog
        run: python scripts/validate_catalog_999.py
      - name: Select category scan mode
        env:
          MANUAL_BATCH: ${{ inputs.batch_index }}
        run: |
          if [ -n "$MANUAL_BATCH" ]; then
            if [ "$MANUAL_BATCH" != "0" ] && [ "$MANUAL_BATCH" != "1" ]; then
              echo "batch_index must be 0 or 1" >&2
              exit 1
            fi
            echo "DEAL_SCAN_MODE=manual" >> "$GITHUB_ENV"
            echo "DEAL_MANUAL_BATCH=$MANUAL_BATCH" >> "$GITHUB_ENV"
          else
            echo "DEAL_SCAN_MODE=full" >> "$GITHUB_ENV"
            echo "DEAL_MANUAL_BATCH=" >> "$GITHUB_ENV"
          fi
      - name: Collect public coupon deals
        run: python bot/news_bot.py
      - name: Collect expanded official brand and marketplace sources
        run: python bot/expanded_sources.py
      - name: Scan first three categories
        if: env.DEAL_SCAN_MODE == 'full' || env.DEAL_MANUAL_BATCH == '0'
        run: |
          echo '=== CATEGORY GROUP 1/2: Fashion + Beauty + Consumer ==='
          DEAL_BATCH_INDEX=0 python bot/scalable_brand_collector.py
      - name: Wait 30 minutes after first category group completes
        if: env.DEAL_SCAN_MODE == 'full'
        run: |
          echo 'First three-category scan completed at:'
          date -u
          echo 'Waiting exactly 30 minutes before scanning the remaining three categories.'
          sleep 1800
      - name: Scan remaining three categories
        if: env.DEAL_SCAN_MODE == 'full' || env.DEAL_MANUAL_BATCH == '1'
        run: |
          echo '=== CATEGORY GROUP 2/2: Home & Living + Food & Grocery + Travel & Hotels ==='
          DEAL_BATCH_INDEX=1 python bot/scalable_brand_collector.py
      - name: Normalize promotion destinations and duplicates
        run: python scripts/normalize_promotions.py
      - name: Validate code and SEO offer destinations
        run: python scripts/validate_offer_links.py
      - name: Keep only six-category offers
        run: python scripts/prune_nonpriority_offers.py
      - name: Build browser data shards and lightweight search index
        run: python scripts/build_data_shards.py
      - name: Sync canonical deals to Supabase (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Generate SEO pages for six priority categories
        run: |
          python bot/seo_generator_999.py
          python scripts/ensure_six_category_seo.py
          python scripts/ensure_six_brand_sitemap.py
      - name: Remove retired categories and placeholder pages
        run: |
          rm -rf gaming sports-outdoor software-digital-services baby-kids-family-family automotive-accessories-books-education-media
          rm -rf automotive-accessories books-education-media
          find brand -maxdepth 1 -type d -name 'catalog-brand-*' -prune -exec rm -rf {} + || true
      - name: Clean six-category SEO sitemap
        run: python scripts/seo_sitemap_cleanup_999.py
      - name: Guard legacy SEO pages
        run: python scripts/seo_legacy_guard.py
      - name: Build centralized GET DEAL routes
        run: python scripts/build_geo_routes.py
      - name: Inject GA4 into legacy public SEO pages
        run: python scripts/inject_ga4.py
      - name: Verify GA4 on public pages
        run: python scripts/verify_ga4.py
      - name: Validate active offers and six-category SEO links
        run: python bot/validate_site.py
      - name: Clean generated Python bytecode
        if: always()
        run: find . -type d -name '__pycache__' -prune -exec rm -rf {} +
      - name: Commit deal data and SEO pages
        if: success()
        run: |
          git config user.name 'DEAL24H Bot'
          git config user.email 'actions@github.com'
          git add data/news.json data/brand_scan_status.json data/*.json brand category fashion beauty consumer home-and-living food-and-grocery travel-and-hotels sitemap*.xml robots.txt go 2>/dev/null || true
          git diff --cached --quiet || git commit -m 'chore: refresh deals and SEO pages'
          git push
      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v5
