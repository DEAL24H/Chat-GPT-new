name: News Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Collect, fetch details and create attributed summaries
        run: python bot/news_bot.py
      - name: Commit news data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          git diff --cached --quiet || git commit -m 'chore: update daily news summaries'
          git push
