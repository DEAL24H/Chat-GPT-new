name: News Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Cerebras secret
        if: ${{ env.CEREBRAS_API_KEY == '' }}
        run: |
          echo 'CEREBRAS_API_KEY is not configured as a GitHub Actions secret.'
          echo 'Create the repository secret CEREBRAS_API_KEY before running the News Bot.'
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Collect, fetch details and create original articles
        run: python bot/news_bot.py
      - name: Commit news data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          git diff --cached --quiet || git commit -m 'chore: update news data'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages with fresh news data
        id: deployment
        uses: actions/deploy-pages@v4
