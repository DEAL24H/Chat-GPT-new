name: Deal Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 8 * * *'
    - cron: '0 16 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'
      - 'data/deal_state.json'
      - 'sitemap.xml'
      - 'sitemap-brands.xml'
      - 'robots.txt'
      - 'fashion/**'
      - 'beauty/**'
      - 'gaming/**'
      - 'consumer/**'
      - 'brand/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal-bot-main
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Validate code syntax
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-fix.js
      - name: Harden expanded source retention
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot/expanded_sources.py')
          s = p.read_text(encoding='utf-8')
          old = '''    domains = {source[1] for source in S}\n    data = [x for x in data if x.get("source_domain") not in domains or not x.get("expanded_source_collector")]\n'''
          new = '''    domains = {source[1] for source in S}\n'''
          if old in s:
              s = s.replace(old, new, 1)
              marker = '''            data.extend(local)\n            added += len(local)\n'''
              replacement = '''            data = [x for x in data if not (x.get("source_domain") == source[1] and x.get("expanded_source_collector"))]\n            data.extend(local)\n            added += len(local)\n'''
              if marker not in s:
                  raise SystemExit('expanded_sources.py retention marker not found')
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')
              print('Expanded source retention hardened.')
          else:
              print('Expanded source retention already hardened.')
          PY
      - name: Collect public coupon deals
        run: python bot/news_bot.py
      - name: Collect expanded official brand and marketplace sources
        run: python bot/expanded_sources.py
      - name: Collect official promotion links
        run: python bot/promotion_links.py
      - name: Generate international SEO pages
        run: python bot/seo_generator.py
      - name: Clean SEO sitemap
        run: python scripts/seo_sitemap_cleanup.py
      - name: Guard legacy SEO pages
        run: python scripts/seo_legacy_guard.py
      - name: Inject GA4 into legacy public SEO pages
        run: python scripts/inject_ga4.py
      - name: Verify GA4 on public pages
        run: python scripts/verify_ga4.py
      - name: Validate active offers and SEO links
        run: python bot/validate_site.py
      - name: Clean generated Python bytecode
        run: |
          printf '%s\n' '__pycache__/' '*.py[cod]' > .gitignore
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git rm -r --cached --ignore-unmatch bot/__pycache__ scripts/__pycache__ || true
      - name: Commit deal data and SEO pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore CNAME data/news.json data/deal_state.json sitemap.xml sitemap-brands.xml robots.txt fashion beauty gaming consumer brand admin/index.html admin/admin.html post.html bot scripts
          git diff --cached --quiet || git commit -m 'chore: update coupon data, promotion links and SEO pages'
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
