name: Deal Bot
on:
  workflow_dispatch:
    inputs:
      batch_index:
        description: 'Optional category group: 0 = Fashion/Beauty/Consumer, 1 = Home & Living/Food & Grocery/Travel & Hotels; blank = full cycle'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/news-bot.yml'
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal24h-main-writer
  cancel-in-progress: false
# Manual full-cycle trigger after canonical Supabase partition-parent fix.
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Validate code syntax
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-home.js
      - name: Validate locked 6-category catalog and source mapping
        run: |
          python scripts/validate_catalog_999.py
          python - <<'PY'
          import json
          p='data/brand_catalog.json'
          d=json.load(open(p,encoding='utf-8'))['categories']
          expected=['Fashion','Beauty','Consumer','Home & Living','Food & Grocery','Travel & Hotels']
          assert list(d)==expected, f'Unexpected category order/set: {list(d)}'
          assert all(len(d[c]) == 89 for c in expected), {c:len(d[c]) for c in expected}
          print('LOCKED CATALOG AUDIT:', sum(len(v) for v in d.values()), 'brands across 6 categories; no production step may rewrite this file.')
          PY
      - name: Select category scan mode
        env:
          MANUAL_BATCH: ${{ inputs.batch_index }}
        run: |
          if [ -n "$MANUAL_BATCH" ]; then
            if [ "$MANUAL_BATCH" != "0" ] && [ "$MANUAL_BATCH" != "1" ]; then
              echo "batch_index must be 0 or 1" >&2
              exit 1
            fi
            echo "DEAL_SCAN_MODE=manual" >> "$GITHUB_ENV"
            echo "DEAL_MANUAL_BATCH=$MANUAL_BATCH" >> "$GITHUB_ENV"
          else
            echo "DEAL_SCAN_MODE=full" >> "$GITHUB_ENV"
            echo "DEAL_MANUAL_BATCH=" >> "$GITHUB_ENV"
          fi
      - name: Collect public coupon deals
        run: python bot/news_bot.py
      - name: Collect expanded official brand and marketplace sources
        run: python bot/expanded_sources.py
      - name: Scan first three categories
        if: env.DEAL_SCAN_MODE == 'full' || env.DEAL_MANUAL_BATCH == '0'
        run: |
          echo '=== CATEGORY GROUP 1/2: Fashion + Beauty + Consumer ==='
          DEAL_BATCH_INDEX=0 python bot/scalable_brand_collector.py
      - name: Scan remaining three categories immediately
        if: env.DEAL_SCAN_MODE == 'full' || env.DEAL_MANUAL_BATCH == '1'
        run: |
          echo '=== CATEGORY GROUP 2/2: Home & Living + Food & Grocery + Travel & Hotels ==='
          DEAL_BATCH_INDEX=1 python bot/scalable_brand_collector.py
      - name: Normalize promotion destinations and duplicates
        run: python scripts/normalize_promotions_fast.py
      - name: Validate code and SEO offer destinations
        run: python scripts/validate_offer_links.py
      - name: Keep only six-category offers
        run: python scripts/prune_nonpriority_offers.py
      - name: Build browser data shards and lightweight search index
        run: python scripts/build_data_shards.py
      - name: Verify six generated shards are populated and consistent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data')
          manifest=json.loads((root/'data-manifest.json').read_text(encoding='utf-8'))
          expected=['fashion','beauty','consumer','home-and-living','food-and-grocery','travel-and-hotels']
          assert list(manifest['shards']) == expected, f'Unexpected shards: {list(manifest["shards"])}'
          counts={}
          for slug in expected:
              meta=manifest['shards'][slug]
              path=root/meta['path']
              rows=json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(rows,list), f'{slug}: shard is not a list'
              assert len(rows)==meta['count'], f'{slug}: manifest={meta["count"]}, file={len(rows)}'
              assert len(rows)>0, f'{slug}: EMPTY SHARD — refusing to deploy'
              assert all((r.get('category') or '') == meta['category'] for r in rows), f'{slug}: category mismatch'
              counts[meta['category']]=len(rows)
          search=json.loads((root/'search-index.json').read_text(encoding='utf-8'))
          assert search.get('count') == sum(counts.values()), f'search count mismatch: {search.get("count")} vs {sum(counts.values())}'
          print('GENERATED DATA AUDIT PASS:', counts, 'total=', sum(counts.values()))
          PY
      - name: Create canonical data version
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('data')
          files=[root/'news.json', root/'data-manifest.json', root/'search-index.json']+sorted((root/'shards').glob('*.json'))
          h=hashlib.sha256()
          for p in files:
              h.update(str(p.relative_to(root)).encode())
              h.update(p.read_bytes())
          version=h.hexdigest()
          payload={'schema':1,'generated_at':datetime.now(timezone.utc).isoformat(),'version':version,'files':[str(p.relative_to(root)) for p in files]}
          (root/'data-version.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CANONICAL DATA VERSION:', version)
          PY
      - name: Sync canonical deals to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL is required'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo 'SUPABASE_SERVICE_ROLE_KEY is required'; exit 1; }
          python scripts/sync_supabase.py
      - name: Generate SEO pages for six priority categories
        run: |
          python bot/seo_generator_999.py
          python scripts/ensure_six_category_seo.py
          python scripts/ensure_six_brand_sitemap.py
      - name: Remove retired categories and placeholder pages
        run: |
          rm -rf gaming sports-outdoor software-digital-services baby-kids-family-family automotive-accessories-books-education-media
          rm -rf automotive-accessories books-education-media
          find brand -maxdepth 1 -type d -name 'catalog-brand-*' -prune -exec rm -rf {} + || true
      - name: Clean six-category SEO sitemap
        run: python scripts/seo_sitemap_cleanup_999.py
      - name: Guard legacy SEO pages
        run: python scripts/seo_legacy_guard.py
      - name: Build centralized GET DEAL routes
        run: python scripts/build_geo_routes.py
      - name: Inject GA4 into legacy public SEO pages
        run: python scripts/inject_ga4.py
      - name: Verify GA4 on public pages
        run: python scripts/verify_ga4.py
      - name: Validate active offers and six-category SEO links
        run: python bot/validate_site_fast.py
      - name: Verify canonical files before publish
        run: |
          set -e
          echo '=== WORKTREE STATUS ==='
          git status --short
          echo '=== GENERATED SHARDS ==='
          wc -c data/shards/*.json
          echo '=== TRACKED SHARDS ==='
          git ls-files data/shards/
          git add data/ brand/ category/ fashion/ beauty/ consumer/ home-and-living/ food-and-grocery/ travel-and-hotels/ sitemap*.xml robots.txt go/ 2>/dev/null || true
          echo '=== STAGED CHANGES ==='
          git diff --cached --name-status
          git diff --cached --stat
          if git diff --quiet -- data/ brand/ category/ fashion/ beauty/ consumer/ home-and-living/ food-and-grocery/ travel-and-hotels/ sitemap*.xml robots.txt go/; then
            echo 'NO_GENERATED_CHANGE_DETECTED'
          else
            if git diff --cached --quiet; then
              echo 'FATAL: generated files differ from HEAD but nothing is staged.' >&2
              exit 1
            fi
          fi
      - name: Commit canonical data and SEO pages
        if: success()
        run: |
          git config user.name 'DEAL24H Bot'
          git config user.email 'actions@github.com'
          if git diff --cached --quiet; then
            echo 'Nothing new to commit; canonical data is already current.'
          else
            git commit -m 'chore: publish canonical deals and SEO data'
            git push origin HEAD:main
          fi
      - name: Verify GitHub main contains the published commit
        if: success()
        run: |
          set -e
          git fetch origin main
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse origin/main)
          echo "LOCAL_MAIN=$LOCAL_SHA"
          echo "REMOTE_MAIN=$REMOTE_SHA"
          test "$LOCAL_SHA" = "$REMOTE_SHA" || { echo 'FATAL: origin/main does not match published workspace'; exit 1; }
          test -s data/data-version.json
          echo 'GITHUB CANONICAL PUBLISH PASS'
      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact from verified Git commit
        if: success()
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v5
