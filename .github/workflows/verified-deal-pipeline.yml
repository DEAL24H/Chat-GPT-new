name: DEAL24H Production Verified Pipeline

on:
  push:
    branches: [TN01, main]
    paths:
      - 'bot/**'
      - 'scripts/**'
      - 'data/assistant_verified_*.json'
      - 'data/brand_catalog.json'
      - 'data/international_brand_registry.json'
      - 'supabase/migrations/**'
      - '.github/workflows/verified-deal-pipeline.yml'
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deal24h-verified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Syntax gate
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-home.js

      - name: Apply assistant-verified 30-per-category source allowlist
        run: python scripts/validate_assistant_source_gate.py

      - name: Discover offers across approved first-party merchant pages
        run: python bot/assistant_verified_news_runner.py

      - name: Resolve each offer to its same-merchant purchase destination
        run: python scripts/normalize_promotions_fast.py

      - name: Verify purchase destinations live
        run: python scripts/validate_offer_links.py

      - name: Build canonical browser data shards
        run: python scripts/build_data_shards.py

      - name: Verify canonical 4-category data shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data')
          expected = ['fashion','electronics','beauty-personal-care','home-and-living']
          manifest = json.loads((root / 'data-manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('categories') == ['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          assert list(manifest.get('shards', {})) == expected
          counts = {}
          for slug in expected:
              meta = manifest['shards'][slug]
              rows = json.loads((root / meta['path']).read_text(encoding='utf-8'))
              assert isinstance(rows, list)
              assert len(rows) == meta['count']
              assert all((r.get('category') or '') == meta['category'] for r in rows)
              counts[meta['category']] = len(rows)
          search = json.loads((root / 'search-index.json').read_text(encoding='utf-8'))
          assert search.get('count') == sum(counts.values())
          print('CANONICAL DATA SHARDS PASS:', counts, 'total=', sum(counts.values()))
          PY

      - name: Create canonical data version
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('data')
          files = [root / 'news.json', root / 'data-manifest.json', root / 'search-index.json'] + sorted((root / 'shards').glob('*.json'))
          h = hashlib.sha256()
          for p in files:
              h.update(str(p.relative_to(root)).encode())
              h.update(p.read_bytes())
          payload = {
              'schema': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'version': h.hexdigest(),
              'files': [str(p.relative_to(root)) for p in files],
          }
          (root / 'data-version.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('CANONICAL DATA VERSION:', payload['version'])
          PY

      - name: Final canonical source and publish contract gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected = ['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          selection = json.loads(Path('data/assistant_verified_source_selection.json').read_text(encoding='utf-8'))
          news = json.loads(Path('data/news.json').read_text(encoding='utf-8'))

          assert selection.get('total') == 120
          assert selection.get('counts') == {c: 30 for c in expected}, selection.get('counts')
          assert len(selection.get('sources', [])) == 120
          assert selection.get('source_authority') == 'assistant_verified_manifests'
          assert selection.get('runtime_source_identity_recheck') is False
          assert selection.get('unique_merchants_per_category') is True
          assert len({(x.get('category'), str(x.get('merchant')).casefold()) for x in selection['sources']}) == 120
          assert all(x.get('verification_status') == 'assistant_verified_first_party' for x in selection['sources'])

          assert isinstance(news, list)
          assert all(x.get('category') in expected for x in news)
          assert all(x.get('source_verification_status') == 'assistant_verified_first_party' for x in news)
          assert all(x.get('official_source') is True for x in news)
          assert all(x.get('final_purchase_url') for x in news)
          assert all(x.get('promotion_url') == x.get('final_purchase_url') == x.get('url') for x in news)
          assert all(x.get('purchase_url_verification_status') == 'live_verified' for x in news)
          assert all(x.get('published_offer_authority') == 'assistant_verified_source_plus_live_exact_purchase_page' for x in news)
          print('FINAL CANONICAL CONTRACT PASS')
          print('PUBLISHED VERIFIED OFFERS:', len(news))
          PY

      - name: Sync verified deals to Supabase
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py

      - name: Generate canonical SEO pages
        if: github.ref == 'refs/heads/main'
        run: python bot/seo_generator_999.py

      - name: Validate canonical site
        if: github.ref == 'refs/heads/main'
        run: python bot/validate_site_fast.py

      - name: Stage canonical generated output
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add data/news.json data/data-manifest.json data/search-index.json data/data-version.json data/shards
          git add brand sitemap.xml sitemap-brands.xml robots.txt
          if git diff --cached --quiet; then
            echo 'NO_CANONICAL_OUTPUT_CHANGES'
          else
            echo 'CANONICAL_OUTPUT_STAGED'
            git diff --cached --stat
          fi

      - name: Commit canonical generated output
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'DEAL24H Bot'
          git config user.email 'actions@github.com'
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
          else
            git commit -m 'chore: publish verified DEAL24H data and SEO'
            git push origin HEAD:main
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy verified Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5
