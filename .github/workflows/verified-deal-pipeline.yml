name: Verified Deal Pipeline
on:
  push:
    branches: [TN01, main]
    paths:
      - 'bot/**'
      - 'scripts/**'
      - 'data/brand_catalog.json'
      - 'data/120_thuong_hieu_kem_trang_goc_va_quoc_gia.xlsx'
      - 'data/allowed_brand_urls.json'
      - 'supabase/migrations/**'
      - 'assets/app-home.js'
      - 'index.html'
      - '.github/workflows/verified-deal-pipeline.yml'
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 8 * * *'
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal24h-main-publisher
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bot dependencies
        run: pip install -r bot/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Syntax gate
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-home.js
      - name: Fast SEO generator preflight
        run: python scripts/test_seo_offer_contract.py
      - name: Build exact URL allowlist from supplied workbook
        run: |
          python scripts/build_allowed_url_manifest.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/allowed_brand_urls.json').read_text(encoding='utf-8'))
          assert d.get('mode')=='exact_source_url_allowlist'
          assert d.get('allow_discovery') is False
          assert d.get('total_brands')==120
          assert d.get('total_urls')==440
          assert len(d.get('entries',[]))==440
          print('EXACT URL ALLOWLIST CONTRACT PASS: brands=120 urls=440')
          PY
      - name: Crawl verified promotions
        timeout-minutes: 30
        run: python bot/deal_bot_with_adapters.py
      - name: Validate canonical deal contract
        timeout-minutes: 5
        run: python scripts/validate_deal_contract.py
      - name: Verify live offer purchase destinations
        timeout-minutes: 20
        run: python scripts/validate_offer_links.py
      - name: Build canonical data shards
        timeout-minutes: 5
        run: python scripts/build_data_shards.py
      - name: Sync verified deals to Supabase
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Generate canonical offer SEO pages and navigation index
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        run: python bot/seo_offer_articles.py
      - name: Generate canonical brand/category SEO pages and site sitemap
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        run: python bot/seo_generator_999.py
      - name: Validate generated SEO output and site navigation
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: python scripts/validate_generated_seo.py
      - name: Validate canonical site
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 5
        run: python bot/validate_site_fast.py
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        timeout-minutes: 10
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
