name: DEAL24H Production Verified Pipeline

on:
  push:
    branches: [TN01, main]
    paths:
      - 'bot/**'
      - 'scripts/**'
      - 'data/assistant_verified_*.json'
      - 'data/brand_catalog.json'
      - 'data/international_brand_registry.json'
      - 'supabase/migrations/**'
      - 'assets/app-home.js'
      - 'index.html'
      - '.github/workflows/verified-deal-pipeline.yml'
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deal24h-main-publisher
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Syntax gate
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-home.js
      - name: Fast SEO generator preflight
        run: python scripts/test_seo_offer_contract.py
      - name: Apply assistant-verified 30-per-category source allowlist
        run: python scripts/validate_assistant_source_gate.py
      - name: Verify generated source selection contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/assistant_verified_source_selection.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          expected=['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          assert d.get('total') == 120
          assert d.get('counts') == {c:30 for c in expected}, d.get('counts')
          assert len(d.get('sources',[])) == 120
          print('SOURCE SELECTION PASS: 120 total / 30 per category')
          PY
      - name: Discover real promotions with the canonical deal bot
        run: python bot/deal_bot.py
      - name: Enforce promotion quality contract before link verification
        run: python scripts/validate_deal_contract.py
      - name: Verify purchase destinations live and exact
        run: python scripts/validate_offer_links.py
      - name: Build canonical browser data shards
        run: python scripts/build_data_shards.py
      - name: Verify canonical 4-category data shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('data'); expected=['fashion','electronics','beauty-personal-care','home-and-living']
          manifest=json.loads((root/'data-manifest.json').read_text(encoding='utf-8'))
          assert manifest.get('categories') == ['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          assert list(manifest.get('shards',{})) == expected
          counts={}
          for slug in expected:
              meta=manifest['shards'][slug]; rows=json.loads((root/meta['path']).read_text(encoding='utf-8'))
              assert isinstance(rows,list) and len(rows)==meta['count']
              assert all((r.get('category') or '')==meta['category'] for r in rows)
              counts[meta['category']]=len(rows)
          search=json.loads((root/'search-index.json').read_text(encoding='utf-8'))
          assert search.get('count') == sum(counts.values())
          print('CANONICAL DATA SHARDS PASS:',counts,'total=',sum(counts.values()))
          PY
      - name: Create canonical data version
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('data'); files=[root/'news.json',root/'data-manifest.json',root/'search-index.json']+sorted((root/'shards').glob('*.json'))
          h=hashlib.sha256()
          for p in files:
              h.update(str(p.relative_to(root)).encode()); h.update(p.read_bytes())
          payload={'schema':1,'generated_at':datetime.now(timezone.utc).isoformat(),'version':h.hexdigest(),'files':[str(p.relative_to(root)) for p in files]}
          (root/'data-version.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CANONICAL DATA VERSION:',payload['version'])
          PY
      - name: Final canonical source and publish contract gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          selection=json.loads(Path('data/assistant_verified_source_selection.json').read_text(encoding='utf-8'))
          news=json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          assert selection.get('total')==120
          assert selection.get('counts')=={c:30 for c in expected}, selection.get('counts')
          assert len(selection.get('sources',[]))==120
          assert selection.get('source_authority')=='assistant_verified_manifests'
          assert selection.get('runtime_source_identity_recheck') is False
          assert selection.get('unique_merchants_per_category') is True
          assert len({(x.get('category'),str(x.get('merchant')).casefold()) for x in selection['sources']})==120
          assert all(x.get('verification_status')=='assistant_verified_first_party' for x in selection['sources'])
          assert isinstance(news,list)
          assert all(x.get('category') in expected for x in news)
          assert all(x.get('source_verification_status')=='assistant_verified_first_party' for x in news)
          assert all(x.get('official_source') is True for x in news)
          assert all(x.get('offer_qualified') is True for x in news)
          assert all(x.get('promotion_type') in {'coupon_code','direct_promotion'} for x in news)
          assert all(x.get('final_purchase_url') for x in news)
          assert all(x.get('promotion_url') for x in news)
          assert all(x.get('purchase_url_verification_status')=='live_verified' for x in news)
          assert all(x.get('published_offer_authority')=='assistant_verified_source_plus_live_exact_purchase_page' for x in news)
          print('FINAL CANONICAL CONTRACT PASS')
          print('PUBLISHED VERIFIED OFFERS:',len(news))
          PY
      - name: Remove legacy generated category and brand pages
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import shutil,sys
          from pathlib import Path
          root=Path('.'); sys.path.insert(0,str(root))
          from bot.catalog_utils import CATALOG,brand_slug
          allowed={brand_slug(e['name']) for entries in CATALOG.values() for e in entries}
          br=root/'brand'; removed=0
          if br.exists():
              for child in br.iterdir():
                  if child.is_dir() and child.name not in allowed: shutil.rmtree(child); removed+=1
          legacy={'beauty','consumer','food-grocery','travel-hotels','gaming','sports-outdoor','software-digital-services','baby-kids-family-family','automotive-accessories','books-education-media'}
          rc=0
          for slug in legacy:
              p=root/slug
              if p.exists() and p.is_dir(): shutil.rmtree(p); rc+=1
          print(f'LEGACY SEO CLEANUP: removed_brand_pages={removed}, removed_category_pages={rc}')
          PY
      - name: Sync verified deals to Supabase
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Generate canonical brand/category SEO pages
        if: github.ref == 'refs/heads/main'
        run: python bot/seo_generator_999.py
      - name: Generate canonical offer SEO pages
        if: github.ref == 'refs/heads/main'
        run: python bot/seo_offer_articles.py
      - name: Validate generated SEO output
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from html.parser import HTMLParser
          class VisibleText(HTMLParser):
              def __init__(self): super().__init__(); self.parts=[]
              def handle_data(self, data): self.parts.append(data)
              def text(self): return ' '.join(self.parts)
          meta=json.loads(Path('seo/seo-modes.json').read_text(encoding='utf-8'))
          assert meta['urls']==meta['counts']['code']+meta['counts']['direct']
          files=list(Path('seo').glob('*/index.html'))
          assert len(files)==meta['urls'], (len(files),meta['urls'])
          banned=re.compile(r'\b(?:current price|regular price|original price|add to cart|cart|checkout|login|sign in|amazon devices small business deals)\b',re.I)
          bad=[]
          for p in files:
              parser=VisibleText(); parser.feed(p.read_text(encoding='utf-8'))
              visible=parser.text()
              if banned.search(visible): bad.append(str(p))
          assert not bad, 'SEO NOISE FOUND IN VISIBLE TEXT: '+', '.join(bad[:20])
          print('SEO OUTPUT PASS:',meta['counts'],'total=',meta['urls'],'visible_text_noise=0')
          PY
      - name: Validate canonical site
        if: github.ref == 'refs/heads/main'
        run: python bot/validate_site_fast.py
      - name: Stage canonical generated output
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -A data/news.json data/data-manifest.json data/search-index.json data/data-version.json data/shards
          git add -A brand seo sitemap.xml sitemap-brands.xml sitemap-seo.xml robots.txt
          for legacy in beauty consumer food-grocery travel-hotels gaming sports-outdoor software-digital-services baby-kids-family-family automotive-accessories books-education-media; do
            git add -A -- "$legacy" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo 'NO_CANONICAL_OUTPUT_CHANGES'; else echo 'CANONICAL_OUTPUT_STAGED'; git diff --cached --stat; fi
      - name: Commit canonical generated output
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'DEAL24H Bot'; git config user.email 'actions@github.com'
          if git diff --cached --quiet; then echo 'Nothing new to commit.'; else
            git commit -m 'chore: publish verified DEAL24H data and SEO'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then echo "CANONICAL_OUTPUT_PUSH_PASS: attempt=$attempt"; break; fi
              if [ "$attempt" -eq 3 ]; then echo 'CANONICAL_OUTPUT_PUSH_FAILED_AFTER_RETRIES'; exit 1; fi
              echo "CANONICAL_OUTPUT_PUSH_RETRY: attempt=$attempt"; git fetch origin main; git rebase origin/main
            done
          fi
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload verified Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy verified Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v5
