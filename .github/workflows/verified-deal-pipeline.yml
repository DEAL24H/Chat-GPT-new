name: Verified Deal Pipeline
on:
  push:
    branches: [TN01, main]
    paths:
      - 'bot/**'
      - 'scripts/**'
      - 'data/assistant_verified_*.json'
      - 'data/brand_catalog.json'
      - 'data/international_brand_registry.json'
      - 'supabase/migrations/**'
      - 'assets/app-home.js'
      - 'index.html'
      - '.github/workflows/verified-deal-pipeline.yml'
  schedule:
    - cron: '17 0 * * *'
    - cron: '17 8 * * *'
    - cron: '17 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: deal24h-main-publisher
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bot dependencies
        run: pip install -r bot/requirements.txt
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Syntax gate
        run: |
          python -m py_compile bot/*.py scripts/*.py
          node --check assets/app-home.js
      - name: Fast SEO generator preflight
        run: python scripts/test_seo_offer_contract.py
      - name: Select assistant verified sources
        run: python scripts/validate_assistant_source_gate.py
      - name: Verify exact 120-source selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/assistant_verified_source_selection.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          expected={'Fashion':30,'Electronics':30,'Beauty & Personal Care':30,'Home & Living':30}
          assert d.get('total')==120
          assert d.get('counts')==expected, d.get('counts')
          assert len(d.get('sources',[]))==120
          print('SOURCE SELECTION CONTRACT PASS:',d['counts'])
          PY
      - name: Discover verified merchant locales
        run: python scripts/discover_merchant_regions.py
      - name: Verify merchant locale registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/merchant_regions.json').read_text(encoding='utf-8'))
          assert d.get('total_brands')==120
          assert len(d.get('brands',{}))==120
          assert d.get('source_authority')=='assistant_verified_manifests_plus_first_party_locale_evidence'
          print('MERCHANT LOCALE REGISTRY PASS:', d.get('brands_with_verified_locales'), 'brands with verified locales')
          PY
      - name: Crawl verified promotions
        run: python bot/deal_bot_with_adapters.py
      - name: Validate canonical deal contract
        run: python scripts/validate_deal_contract.py
      - name: Verify live offer purchase destinations
        run: python scripts/validate_offer_links.py
      - name: Build canonical data shards
        run: python scripts/build_data_shards.py
      - name: Verify canonical data shards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          root=Path('data')
          news=json.loads((root/'news.json').read_text(encoding='utf-8'))
          manifest=json.loads((root/'data-manifest.json').read_text(encoding='utf-8'))
          search=json.loads((root/'search-index.json').read_text(encoding='utf-8'))
          assert manifest.get('total')==len(news)
          counts={c:sum(x.get('category')==c for x in news) for c in expected}
          assert manifest.get('counts')==counts
          assert search.get('count')==sum(counts.values())
          print('CANONICAL DATA SHARDS PASS:',counts,'total=',sum(counts.values()))
          PY
      - name: Create canonical data version
        run: |
          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('data'); files=[root/'news.json',root/'data-manifest.json',root/'search-index.json',root/'merchant_regions.json']+sorted((root/'shards').glob('*.json'))
          h=hashlib.sha256()
          for p in files:
              h.update(str(p.relative_to(root)).encode()); h.update(p.read_bytes())
          payload={'schema':1,'generated_at':datetime.now(timezone.utc).isoformat(),'version':h.hexdigest(),'files':[str(p.relative_to(root)) for p in files]}
          (root/'data-version.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CANONICAL DATA VERSION:',payload['version'])
          PY
      - name: Final canonical source and publish contract gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected=['Fashion','Electronics','Beauty & Personal Care','Home & Living']
          selection=json.loads(Path('data/assistant_verified_source_selection.json').read_text(encoding='utf-8'))
          news=json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          regions=json.loads(Path('data/merchant_regions.json').read_text(encoding='utf-8'))
          assert selection.get('total')==120
          assert selection.get('counts')=={c:30 for c in expected}, selection.get('counts')
          assert len(selection.get('sources',[]))==120
          assert selection.get('source_authority')=='assistant_verified_manifests'
          assert selection.get('runtime_source_identity_recheck') is False
          assert selection.get('unique_merchants_per_category') is True
          assert len({(x.get('category'),str(x.get('merchant')).casefold()) for x in selection['sources']})==120
          assert all(x.get('verification_status')=='assistant_verified_first_party' for x in selection['sources'])
          assert regions.get('total_brands')==120 and len(regions.get('brands',{}))==120
          assert isinstance(news,list)
          assert all(x.get('category') in expected for x in news)
          assert all(x.get('source_verification_status')=='assistant_verified_first_party' for x in news)
          assert all(x.get('official_source') is True for x in news)
          assert all(x.get('offer_qualified') is True for x in news)
          assert all(x.get('promotion_type') in {'coupon_code','direct_promotion'} for x in news)
          assert all(x.get('final_purchase_url') for x in news)
          assert all(x.get('promotion_url') for x in news)
          assert all(x.get('purchase_url_verification_status')=='live_verified' for x in news)
          assert all(x.get('published_offer_authority')=='assistant_verified_source_plus_live_brand_purchase_destination' for x in news)
          print('FINAL CANONICAL CONTRACT PASS')
          print('PUBLISHED VERIFIED OFFERS:',len(news))
          PY
      - name: Remove legacy generated category and brand pages
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import shutil,sys
          from pathlib import Path
          root=Path('.'); sys.path.insert(0,str(root))
          from bot.catalog_utils import CATALOG,brand_slug
          allowed={brand_slug(e['name']) for entries in CATALOG.values() for e in entries}
          br=root/'brand'; removed=0
          if br.exists():
              for child in br.iterdir():
                  if child.is_dir() and child.name not in allowed: shutil.rmtree(child); removed+=1
          legacy={'beauty','consumer','food-grocery','travel-hotels','gaming','sports-outdoor','software-digital-services','baby-kids-family-family','automotive-accessories','books-education-media'}
          rc=0
          for slug in legacy:
              p=root/slug
              if p.exists() and p.is_dir(): shutil.rmtree(p); rc+=1
          print(f'LEGACY SEO CLEANUP: removed_brand_pages={removed}, removed_category_pages={rc}')
          PY
      - name: Sync verified deals to Supabase
        if: github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_supabase.py
      - name: Generate canonical offer SEO pages and navigation index
        if: github.ref == 'refs/heads/main'
        run: python bot/seo_offer_articles.py
      - name: Generate canonical brand/category SEO pages and site sitemap
        if: github.ref == 'refs/heads/main'
        run: python bot/seo_generator_999.py
      - name: Validate generated SEO output and site navigation
        if: github.ref == 'refs/heads/main'
        run: python scripts/validate_generated_seo.py
      - name: Validate canonical site
        if: github.ref == 'refs/heads/main'
        run: python bot/validate_site_fast.py
      - name: Stage canonical generated output
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add -A data/news.json data/data-manifest.json data/search-index.json data/data-version.json data/merchant_regions.json data/shards
          git add -A brand seo sitemap.xml sitemap-brands.xml sitemap-seo.xml robots.txt
          for legacy in beauty consumer food-grocery travel-hotels gaming sports-outdoor software-digital-services baby-kids-family-family automotive-accessories books-education-media; do
            git rm -r --ignore-unmatch "$legacy"
          done
          git status --short
      - name: Commit generated output
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git fetch origin main
          remote_sha=$(git rev-parse origin/main)
          local_sha=$(git rev-parse HEAD)
          if [ "$remote_sha" != "$local_sha" ]; then
            echo "Remote main advanced from $local_sha to $remote_sha while this run was executing."
            echo 'Discarding this run’s stale generated workspace and deploying the current main safely.'
            git reset --hard "$remote_sha"
            git clean -fd
          elif git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git config user.name 'deal24h-bot'
            git config user.email 'deal24h-bot@users.noreply.github.com'
            git commit -m 'chore: publish verified DEAL24H offers and SEO'
            git push origin main
          fi
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
