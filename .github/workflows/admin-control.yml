name: Admin Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation
        required: true
        type: choice
        options: [run_bot, deploy]

permissions:
  actions: write
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Run canonical production pipeline
        run: gh workflow run verified-deal-pipeline.yml --ref main
        env:
          GH_TOKEN: '${{ github.token }}'
