name: DEAL24H Offer SEO Pages

on:
  workflow_run:
    workflows: ["DEAL24H Production Verified Pipeline"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deal24h-main-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate offer SEO pages
        run: python bot/seo_offer_articles.py

      - name: Validate generated SEO modes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('seo/seo-modes.json').read_text(encoding='utf-8'))
          assert data['urls'] == data['counts']['code'] + data['counts']['direct']
          print('SEO MODES PASS:', data['counts'], 'total=', data['urls'])
          PY

      - name: Commit SEO pages
        run: |
          set -euo pipefail
          git config user.name 'DEAL24H Bot'
          git config user.email 'actions@github.com'
          if git diff --cached --quiet; then
            git add seo sitemap-seo.xml
          fi
          git add seo sitemap-seo.xml
          if git diff --cached --quiet; then
            echo 'NO_OFFER_SEO_CHANGES'
          else
            git commit -m 'chore: publish explicit offer SEO pages'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "OFFER_SEO_PUSH_PASS: attempt=$attempt"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'OFFER_SEO_PUSH_FAILED_AFTER_RETRIES'
                exit 1
              fi
              echo "OFFER_SEO_PUSH_RETRY: attempt=$attempt"
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
