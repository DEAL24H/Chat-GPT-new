name: Analytics Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - 'scripts/fetch_analytics.py'
      - '.github/workflows/analytics.yml'
permissions:
  contents: write
  actions: write
concurrency:
  group: analytics-main
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analytics client
        run: pip install google-analytics-data google-auth
      - name: Collect GA4 data
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/fetch_analytics.py
      - name: Commit analytics snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analytics.json
          git diff --cached --quiet || git commit -m 'chore: update analytics snapshot'
          git push
      - name: Deploy Pages with fresh analytics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main
