name: Analytics Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - 'scripts/fetch_analytics.py'
      - '.github/workflows/analytics.yml'
permissions:
  id-token: write
  contents: write
  actions: write
concurrency:
  group: analytics-main
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/24340690831/locations/global/workloadIdentityPools/deal24h-github/providers/github'
          service_account: 'deal24h-analytics@deal24h-analytics-507501.iam.gserviceaccount.com'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analytics client
        run: pip install google-analytics-data google-auth requests
      - name: Collect GA4 data
        env:
          GA4_PROPERTY_ID: '552658187'
        run: |
          python scripts/fetch_analytics.py
      - name: Commit analytics snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/analytics.json
          git diff --cached --quiet || git commit -m 'chore: update analytics snapshot'
          git push
      - name: Deploy Pages with fresh analytics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-deploy.yml --ref main

# GA4 access is granted to the WIF service account; no JSON key is required.
