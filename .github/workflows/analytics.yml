name: Analytics Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - 'scripts/fetch_analytics.py'
      - '.github/workflows/analytics.yml'
permissions:
  id-token: write
  contents: read
  pages: write
concurrency:
  group: analytics-pages
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/24340690831/locations/global/workloadIdentityPools/deal24h-github/providers/github'
          service_account: 'deal24h-analytics@deal24h-analytics-507501.iam.gserviceaccount.com'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analytics client
        run: pip install google-analytics-data google-auth requests
      - name: Collect GA4 data
        env:
          GA4_PROPERTY_ID: '552658187'
        run: python scripts/fetch_analytics.py
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact with fresh analytics
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Pages with fresh analytics
        id: deployment
        uses: actions/deploy-pages@v5

# Analytics is intentionally read-only with respect to GitHub main.
# The production Deal Bot is the only workflow that publishes canonical data to main.
