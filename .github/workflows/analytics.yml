name: Analytics Snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    paths:
      - 'scripts/fetch_analytics.py'
      - '.github/workflows/analytics.yml'
permissions:
  id-token: write
  contents: read
concurrency:
  group: analytics-collection
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/24340690831/locations/global/workloadIdentityPools/deal24h-github/providers/github'
          service_account: 'deal24h-analytics@deal24h-analytics-507501.iam.gserviceaccount.com'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install analytics client
        run: pip install google-analytics-data google-auth requests
      - name: Collect GA4 data
        env:
          GA4_PROPERTY_ID: '552658187'
        run: python scripts/fetch_analytics.py
      - name: Store analytics report as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: deal24h-analytics-${{ github.run_id }}
          path: data/analytics.json
          retention-days: 14

# Analytics is read-only with respect to GitHub main and GitHub Pages.
# The Verified Deal Pipeline is the only production publisher.
