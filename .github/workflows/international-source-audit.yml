name: TN01 International Source Audit

on:
  push:
    branches: [TN01]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TN01
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate international registry
        run: python scripts/validate_international_registry.py
      - name: Publish audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: international-source-audit
          path: data/international_source_audit.json
      - name: Commit audit report to TN01
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/international_source_audit.json
          git diff --cached --quiet || git commit -m "TN01: update international source audit"
          git push
