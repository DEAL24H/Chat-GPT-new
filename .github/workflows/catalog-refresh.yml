name: Catalog Health Refresh

on:
  push:
    branches: [main]
    paths:
      - 'data/brand_catalog.json'
      - 'scripts/strict_catalog_integrity.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal24h-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Strict catalog integrity audit
        run: python scripts/strict_catalog_integrity.py
